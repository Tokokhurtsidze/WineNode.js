<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#1a0a0a"/>

  <!-- Double chevron crown at top -->
  <polyline points="46,27 50,22 54,27" fill="none" stroke="#C8B08A" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt"/>
  <polyline points="42,32 50,25 58,32" fill="none" stroke="#C8B08A" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- Main peaked arch (outer building shape) -->
  <path d="M21 72 L21 48 L50 28 L79 48 L79 72"
        fill="none" stroke="#C8B08A" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- Left fanned vine arms (3 curves radiating from center-bottom) -->
  <path d="M50 72 Q38 66 24 52" fill="none" stroke="#C8B08A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 72 Q40 63 27 50" fill="none" stroke="#C8B08A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 72 Q43 60 31 48" fill="none" stroke="#C8B08A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right fanned vine arms (mirrored) -->
  <path d="M50 72 Q62 66 76 52" fill="none" stroke="#C8B08A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 72 Q60 63 73 50" fill="none" stroke="#C8B08A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 72 Q57 60 69 48" fill="none" stroke="#C8B08A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Horizontal trellis bars across the lower arch interior -->
  <line x1="21" y1="58" x2="79" y2="58" stroke="#C8B08A" stroke-width="2"/>
  <line x1="21" y1="65" x2="79" y2="65" stroke="#C8B08A" stroke-width="2"/>
  <line x1="21" y1="72" x2="79" y2="72" stroke="#C8B08A" stroke-width="2"/>

  <!-- Left grape cluster (2-3-2 bunch) -->
  <circle cx="9"  cy="57" r="2.8" fill="#C8B08A"/>
  <circle cx="15" cy="57" r="2.8" fill="#C8B08A"/>
  <circle cx="6"  cy="63" r="2.8" fill="#C8B08A"/>
  <circle cx="12" cy="63" r="2.8" fill="#C8B08A"/>
  <circle cx="18" cy="63" r="2.8" fill="#C8B08A"/>
  <circle cx="9"  cy="69" r="2.8" fill="#C8B08A"/>
  <circle cx="15" cy="69" r="2.8" fill="#C8B08A"/>

  <!-- Right grape cluster (mirrored) -->
  <circle cx="85" cy="57" r="2.8" fill="#C8B08A"/>
  <circle cx="91" cy="57" r="2.8" fill="#C8B08A"/>
  <circle cx="82" cy="63" r="2.8" fill="#C8B08A"/>
  <circle cx="88" cy="63" r="2.8" fill="#C8B08A"/>
  <circle cx="94" cy="63" r="2.8" fill="#C8B08A"/>
  <circle cx="85" cy="69" r="2.8" fill="#C8B08A"/>
  <circle cx="91" cy="69" r="2.8" fill="#C8B08A"/>
</svg>
